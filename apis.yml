name: DwellSocial
description: DwellSocial is a Techstars-backed, Chicago-area community food service that brings iconic
  city restaurants to suburban neighborhoods. Members browse curated restaurant offerings, place group
  orders for scheduled dates, and meet for a convenient neighborhood pickup to enjoy city-quality meals
  at home. The service also runs fundraisers for local causes and non-profits, and currently serves
  suburbs such as Naperville and Elmhurst. DwellSocial operates as a consumer web and mobile
  application; no public developer API, OpenAPI, documentation, or well-known discovery surface was
  found during enrichment (dwellsocial.com serves a JavaScript single-page app and api.dwellsocial.com
  returns the same marketing site rather than a machine API).
